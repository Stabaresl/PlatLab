services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sin `ports` a propósito: web/worker llegan por la red interna de
    # compose (postgres:5432). Publicarlo al host chocaba con un PostgreSQL
    # nativo instalado en la máquina (muy común en Windows) y lo exponía a
    # la red del aula. Para correr el backend fuera de Docker, ver
    # docker-compose.override.example.yml.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Sin `ports`: Redis no tiene contraseña y guarda sesiones + un caché
    # serializado con pickle — publicado en 0.0.0.0 (como antes) era una vía
    # de ejecución remota de código para cualquiera en la misma red.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Único punto de contacto con el Docker del host. En vez de montar
  # /var/run/docker.sock directo en web/worker (control root-equivalente
  # sobre el host completo si el proceso Django/Celery se compromete), el
  # backend habla con este proxy vía DOCKER_HOST=tcp://docker-proxy:2375 —
  # que solo reenvía las llamadas de la API que
  # lab_environments/docker_provider.py realmente usa (crear/listar/parar
  # contenedores, exec interactivo, pull de imagen). Todo lo demás
  # (secrets, swarm, configs, build, plugins, /info del host, redes,
  # volúmenes) queda bloqueado a nivel de API, incluso con RCE en el backend.
  #
  # Límite real de este mitigante: el proxy no valida el *contenido* de las
  # llamadas que sí deja pasar — un POST /containers/create con
  # `privileged: true` o un bind-mount de "/" seguiría siendo posible para
  # quien llegue directo a este proxy con acceso de red. Reduce la
  # superficie de ataque de forma significativa, pero no reemplaza separar
  # el ejecutor a un host/VM dedicado (pendiente, ver docker_provider.py).
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      EXEC: 1
      POST: 1
      VERSION: 1
      PING: 1
      EVENTS: 0
      INFO: 0
      NETWORKS: 0
      VOLUMES: 0
      SERVICES: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      CONFIGS: 0
      BUILD: 0
      COMMIT: 0
      DISTRIBUTION: 0
      AUTH: 0
      SESSION: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  web:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    restart: unless-stopped
    env_file: .env
    environment:
      # docker.from_env() (docker_provider.py) lee esta variable sola —
      # no hace falta tocar código, solo dejar de montar el socket crudo.
      DOCKER_HOST: tcp://docker-proxy:2375
      # Único servicio que migra (ver docker/entrypoint.sh) — worker/beat
      # esperan a que web esté sano antes de arrancar.
      RUN_MIGRATIONS: "1"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=4)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    # Uvicorn sirve HTTP + WebSocket (config/asgi.py) con WEB_CONCURRENCY
    # procesos — reemplaza a daphne (un solo proceso Python, se saturaba
    # en ~30 req/s en loadtests/). `--lifespan off`: Django no implementa
    # el protocolo lifespan de ASGI.
    command: ["sh", "-c", "exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers ${WEB_CONCURRENCY:-4} --lifespan off --proxy-headers --forwarded-allow-ips '*'"]

  worker:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    restart: unless-stopped
    env_file: .env
    environment:
      # El reaper de entornos inactivos (Celery Beat -> este worker)
      # también habla con Docker solo a través del proxy — mismo motivo
      # que en `web`.
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      web:
        condition: service_healthy
    # Sin --concurrency, Celery levanta un proceso hijo por CPU (12 en una
    # laptop típica, ~700 MB de RAM medidos) — memoria que hace falta para
    # los contenedores de práctica de los estudiantes.
    command: ["sh", "-c", "exec celery -A config worker -l info --concurrency ${CELERY_CONCURRENCY:-4}"]

  # Worker dedicado a aprovisionar entornos de práctica (cola `entornos`,
  # ver config/celery.py): pool de hilos porque la tarea es casi todo
  # espera de I/O contra Docker — 20 aprovisionamientos en paralelo en un
  # solo proceso (~100 MB), en vez de 4 en el worker general.
  worker-entornos:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    restart: unless-stopped
    env_file: .env
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
      # Un hilo por aprovisionamiento concurrente + margen para el pool de BD.
      DB_POOL_MAX: "25"
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
      web:
        condition: service_healthy
    command: ["sh", "-c", "exec celery -A config worker -Q entornos --pool threads --concurrency ${LAB_ENV_PROVISION_CONCURRENCY:-20} -n entornos@%h -l info"]

  beat:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    command: ["celery", "-A", "config", "beat", "-l", "info"]

volumes:
  postgres_data:
