services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
      # Docker-outside-of-Docker: le permite al backend crear/parar
      # contenedores hermanos (lab_environments) hablando con el Docker del
      # host. ADVERTENCIA DE SEGURIDAD: esto le da a este contenedor control
      # equivalente a root sobre el host Docker — aceptable para desarrollo
      # en una máquina propia, pero antes de exponer el servicio a
      # estudiantes reales por Internet hace falta separar el ejecutor de
      # contenedores del backend (host/VM dedicado) y reforzar el
      # aislamiento (gVisor/Kata) — ver modules/lab_environments/infrastructure/docker_provider.py.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Daphne sirve HTTP + WebSocket en un solo proceso ASGI (config/asgi.py)
    # — reemplaza a `runserver`, que no entiende WebSockets.
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]

  worker:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
      # El reaper de entornos inactivos (Celery Beat -> este worker) también
      # necesita poder parar contenedores — mismo trade-off de seguridad que
      # en `web` (ver comentario arriba).
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "worker", "-l", "info"]

  beat:
    build:
      context: .
      args:
        REQUIREMENTS_FILE: requirements/dev.txt
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["celery", "-A", "config", "beat", "-l", "info"]

volumes:
  postgres_data:
