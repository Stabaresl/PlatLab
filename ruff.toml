# 120: los docstrings explican decisiones en español y 100 obligaba a cortes
# artificiales (179 líneas fallando hacían que el job `lint` del CI
# fallara siempre y, por `needs: lint`, que los tests nunca se ejecutaran).
line-length = 120
target-version = "py312"
exclude = ["migrations"]

[lint]
select = ["E", "F", "I"]
# F401/F403/F405: los settings usan "from .base import *" a propósito
# (patrón estándar de Django para separar base/dev/prod).
# E501 en seeds: son contenido didáctico (teoría, salidas de consola simuladas)
# donde partir los strings empeora la lectura.
per-file-ignores = { "config/settings/dev.py" = ["F401", "F403", "F405"], "config/settings/prod.py" = ["F401", "F403", "F405"], "modules/*/management/commands/seed_*.py" = ["E501"], "modules/*/management/commands/_contenido_*.py" = ["E501"] }
